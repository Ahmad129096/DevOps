name: Deploy Next JS App

on: 
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    concurrency:
      group: deploy
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: npm install
      - name: Build Next Js App
        run: npm run build
      - name: Deploy App
        run: echo "Deploying App"
        
